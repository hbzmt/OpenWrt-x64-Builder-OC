name: OpenWrt x86-64 Builder

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: "OpenWrt Version (e.g. 25.12.4 / 24.10.x / SNAPSHOT)"
        required: true
        default: "25.12.5"
      lan_ip:
        description: "LAN IP (only for static, e.g. 10.0.0.99)"
        required: true
        default: "10.0.0.99"
      gateway:
        description: "Gateway (e.g. 10.0.0.2)"
        required: true
        default: "10.0.0.2"
      dns:
        description: "DNS (e.g. 10.0.0.7)"
        required: true
        default: "10.0.0.2"
      ip_mode:
        description: "IP Mode (static or dhcp)"
        required: true
        default: "static"
      rootfs_size:
        description: "RootFS Size (MB)"
        required: true
        default: "2048"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Build Config
        run: |
          echo "===================================="
          echo "OpenWrt x86-64 Build Config"
          echo "===================================="
          echo "Firmware Version : ${{ github.event.inputs.firmware_version }}"
          echo "RootFS Size      : ${{ github.event.inputs.rootfs_size }} MB"
          echo "IP Mode          : ${{ github.event.inputs.ip_mode }}"
          echo "===================================="

      - name: Validate OpenWrt Version
        run: |
          VERSION="${{ github.event.inputs.firmware_version }}"

          if [ "$VERSION" = "SNAPSHOT" ]; then
            echo "SNAPSHOT build - APK mode"
            exit 0
          fi

          if [[ ! "$VERSION" =~ ^([0-9]+)\. ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"

          if (( MAJOR < 25 )); then
            echo "Only OpenWrt 25 and newer versions are supported"
            exit 1
          fi

          URL="https://downloads.openwrt.org/releases/$VERSION/"

          echo "Checking OpenWrt version: $VERSION"

          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Invalid OpenWrt version"
            exit 1
          fi

          echo "OpenWrt version valid"

      - name: Detect Download URL
        run: |
          VERSION="${{ github.event.inputs.firmware_version }}"
          if [ "$VERSION" = "SNAPSHOT" ]; then
            echo "TARGET_PATH=https://downloads.openwrt.org/snapshots/targets/x86/64/" >> $GITHUB_ENV
          else
            echo "TARGET_PATH=https://downloads.openwrt.org/releases/$VERSION/targets/x86/64/" >> $GITHUB_ENV
          fi

      - name: Get ImageBuilder Filename
        run: |
          HTML=$(curl -sL "$TARGET_PATH")
          FILE=$(echo "$HTML" | grep -oE 'openwrt-imagebuilder-[^"]*x86-64[^"]*\.tar\.zst' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ ERROR: ImageBuilder not found"
            echo "$HTML" | head -n 30
            exit 1
          fi
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "✅ Found ImageBuilder: $FILE"

      - name: Download & Extract ImageBuilder
        run: |
          mkdir -p openwrt
          cd openwrt
          wget -q --show-progress "$TARGET_PATH$FILE" -O imagebuilder.tar.zst
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst
          ls -lah

      - name: Download Latest OpenClash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "===================================="
          echo "Downloading Latest OpenClash"
          echo "===================================="

          # 定位 ImageBuilder
          IB_DIR=$(find openwrt -maxdepth 1 -type d \
            -name 'openwrt-imagebuilder-*' | head -n 1)

          if [ -z "$IB_DIR" ]; then
            echo "ERROR: ImageBuilder directory not found"
            exit 1
          fi

          # 创建本地 APK 仓库目录
          mkdir -p "$IB_DIR/packages"

          # 获取 GitHub 最新 Release
          RELEASE_JSON=$(curl -fsSL \
            --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vernesong/OpenClash/releases/latest)

          # 获取最新 APK 安装包
          ASSET=$(echo "$RELEASE_JSON" | jq -c \
            '[.assets[] | select(.name | startswith("luci-app-openclash-") and endswith(".apk"))][0] // empty')

          if [ -z "$ASSET" ]; then
            echo "ERROR: OpenClash APK not found in latest Release"
            exit 1
          fi

          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          FILE=$(echo "$ASSET" | jq -r '.name')
          URL=$(echo "$ASSET" | jq -r '.browser_download_url')

          echo "OpenClash Version: $VERSION"
          echo "Package: $FILE"

          # 下载到 ImageBuilder 本地软件包目录
          curl -fL --retry 3 "$URL" \
            -o "$IB_DIR/packages/$FILE"

          if [ ! -s "$IB_DIR/packages/$FILE" ]; then
            echo "ERROR: Download failed"
            exit 1
          fi

          echo "OpenClash downloaded successfully"

          ls -lh "$IB_DIR/packages/"


      - name: Download Latest Smart Kernel
        run: |
          set -e

          echo "===================================="
          echo "Downloading Latest Smart Kernel"
          echo "===================================="

          # Smart 内核版本查询地址
          VERSION_URL="https://github.com/vernesong/mihomo/releases/download/Prerelease-Alpha/version.txt"

          # 获取最新版本
          SMART_VERSION=$(curl -fsSL --retry 3 "$VERSION_URL" | tr -d '\r\n')

          if [ -z "$SMART_VERSION" ]; then
            echo "ERROR: Failed to get Smart kernel version"
            exit 1
          fi

          echo "Smart Kernel Version: $SMART_VERSION"

          # x86-64 Linux Smart 内核
          KERNEL_NAME="mihomo-linux-amd64-v2-go120"

          DOWNLOAD_URL="https://github.com/vernesong/mihomo/releases/download/Prerelease-Alpha/${KERNEL_NAME}-${SMART_VERSION}.gz"

          # 创建 OpenClash 内核目录
          mkdir -p files/etc/openclash/core

          # 下载内核
          curl -fL --retry 3 \
            "$DOWNLOAD_URL" \
            -o /tmp/mihomo-smart.gz

          # 解压并直接命名为 OpenClash 需要的名称
          gzip -dc /tmp/mihomo-smart.gz \
            > files/etc/openclash/core/clash_meta

          # 设置可执行权限
          chmod 755 files/etc/openclash/core/clash_meta

          # 检查文件
          if [ ! -s files/etc/openclash/core/clash_meta ]; then
            echo "ERROR: Smart kernel installation failed"
            exit 1
          fi

          echo "===================================="
          echo "Smart Kernel Installed"
          echo "===================================="

          ls -lh files/etc/openclash/core/clash_meta
          file files/etc/openclash/core/clash_meta


      # ====================== 安装自定义 APK ======================
      - name: Prepare Custom APK Packages
        run: |
          set -e

          echo "Preparing custom APK packages..."

          mkdir -p openwrt/openwrt-imagebuilder-*/packages

          for APK in packages/*.apk; do
            [ -f "$APK" ] || continue

            echo "Copying: $APK"
            cp "$APK" openwrt/openwrt-imagebuilder-*/packages/
          done

          echo "Custom APK files:"
          ls -lh openwrt/openwrt-imagebuilder-*/packages/*.apk

      # ====================== IP 配置 ======================
      - name: Generate network config (IP UI)
        run: |
          mkdir -p files/etc/config

          MODE="${{ github.event.inputs.ip_mode }}"
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          GATEWAY="${{ github.event.inputs.gateway }}"
          DNS="${{ github.event.inputs.dns }}"

          # 复制模板
          cp files/etc/config/network.tpl files/etc/config/network || {
            echo "❌ network.tpl not found! Please make sure it exists in repository."
            exit 1
          }

          if [ "$MODE" = "dhcp" ]; then
            echo "Configuring DHCP mode..."
            sed -i 's/__PROTO__/dhcp/' files/etc/config/network
            sed -i '/__IP__/d' files/etc/config/network
            sed -i '/__GW__/d' files/etc/config/network
            sed -i '/__DNS__/d' files/etc/config/network
          else
            echo "Configuring Static IP mode..."
            sed -i 's/__PROTO__/static/' files/etc/config/network
            sed -i "s/__IP__/$LAN_IP/" files/etc/config/network
            sed -i "s/__GW__/$GATEWAY/" files/etc/config/network
            sed -i "s/__DNS__/$DNS/" files/etc/config/network
          fi

          echo "=== FINAL NETWORK CONFIG ==="
          cat files/etc/config/network
          echo "============================"

      # ====================== 构建固件 ======================
      - name: Build OpenWrt Image
        run: |
          cd openwrt/openwrt-imagebuilder-*
          echo "Copying custom files..."
          cp -r ../../files . 2>/dev/null || echo "No custom files directory found (optional)"
        
          ROOTFS_SIZE="${{ github.event.inputs.rootfs_size }}"
          
          # 这里执行脚本
          chmod +x ../../shell/custom-packages.sh
          source ../../shell/custom-packages.sh

          echo "CUSTOM_PACKAGES=$CUSTOM_PACKAGES"

          echo "Starting build with ROOTFS_PARTSIZE=$ROOTFS_SIZE ..."
          
          make image \
            PROFILE="generic" \
            ROOTFS_PARTSIZE=$ROOTFS_SIZE \
            PACKAGES="$CUSTOM_PACKAGES" \
            FILES="files"

          echo "Build finished"
          ls -lh bin/targets/x86/64/

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-firmware
          path: openwrt/openwrt-imagebuilder-*/bin/targets/x86/64/*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ github.event.inputs.firmware_version }}
          name: OpenWrt x86-64 ${{ github.event.inputs.firmware_version }}
          files: |
            openwrt/openwrt-imagebuilder-*/bin/targets/x86/64/*generic-ext4-combined-efi.img.gz
            openwrt/openwrt-imagebuilder-*/bin/targets/x86/64/*generic-squashfs-combined-efi.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
